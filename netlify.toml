# Static site, no build step. Netlify serves privacy.html at /privacy
# automatically, so no redirects are needed for the clean URLs.
#
# The only code is in netlify/edge-functions/, which Netlify finds by its
# folder and runs on the server. app-link.js draws the page behind a link
# shared from the app (/post/..., /routine/..., /@...), and live-totals.js
# writes the running total into the home page. See README.md.

[build]
  publish = "."
  command = ""

# No page on this site runs JavaScript, so script-src stays 'none'. The waitlist
# posts to Netlify Forms on this same origin, which is what form-action allows.
# The edge functions set these same headers on the pages they return, since
# these are only promised for static files: netlify/edge-functions/lib/
# headers.js. Change one, change both.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

# Tells iOS which links open the app instead of Safari. Apple reads it as
# JSON, and the file has no extension to say so. It must answer 200 at exactly
# this path with no redirect, or Universal Links silently never switch on.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
